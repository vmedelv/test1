<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Confirmacion de compra — Demo Ticketing</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">🎟️ TicketingCL <span class="badge">demo estatico</span></a>
  </header>
  <main class="narrow" id="app">
    <p class="spinner">Cargando…</p>
  </main>
  <script src="lib/store.js"></script>
  <script src="lib/qr.js"></script>
  <script src="lib/domain.js"></script>
  <script src="lib/seed.js"></script>
  <script src="common.js"></script>
  <script>
    const orderId = qparam('order');

    function load() {
      const app = document.getElementById('app');
      const order = Domain.getOrder(orderId);
      const event = Domain.publicEventView(Domain.getEventById(order.eventId));

      if (order.status !== 'paid') {
        app.innerHTML = `<div class="notice warn">Esta orden esta en estado "${order.status}".</div>`;
        return;
      }

      const tickets = Domain.ticketsForOrder(orderId);

      app.innerHTML = `
        <div class="notice ok">Pago confirmado via ${order.gateway === 'flow' ? 'Flow' : 'Webpay Plus'} (simulado). Se genero ${tickets.length} entrada(s).</div>
        <h1>${escapeHtml(event.title)}</h1>
        <p class="lead">${fmtDateTime(event.startsAt)}${event.venueName ? ' · ' + escapeHtml(event.venueName) : ''}</p>

        ${tickets.map((t) => `
          <div class="card">
            <div class="ticket-visual">
              <img src="${QR.dataUrlFor(t.code)}" width="90" height="90" alt="Codigo de acceso" />
              <div>
                <div><strong>${escapeHtml(t.ticketTypeName)}</strong></div>
                <div class="code-chip">${escapeHtml(t.code)}</div>
                <div style="margin-top:8px"><a href="ticket.html?id=${t.id}">Ver ticket completo →</a></div>
              </div>
            </div>
          </div>
        `).join('')}

        <p class="footer-note">Comprador: ${escapeHtml(order.buyerName)} · ${escapeHtml(order.buyerEmail)} · Total pagado: ${money(order.total)}</p>
      `;
    }

    tryRun(load, (msg) => notice(document.getElementById('app'), 'danger', msg));
  </script>
</body>
</html>
